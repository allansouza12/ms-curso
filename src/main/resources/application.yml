server:
  port: 8081

spring:
  application:
    name: ms-curso
  config:
    import: optional:classpath:secrets.yml
  datasource:
    url: jdbc:mysql://localhost:3306/ms_curso?createDatabaseIfNotExist=true&serverTimezone=America/Bahia
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true